apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healer-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: self-healer-role
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: self-healer-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: self-healer-sa
  namespace: default
roleRef:
  kind: Role
  name: self-healer-role
  apiGroup: rbac.authorization.k8s.io
